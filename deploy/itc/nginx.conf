server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 172.16.50.234;

    ssl_certificate /etc/ssl/webscenen/webscenen.crt;
    ssl_certificate_key /etc/ssl/webscenen/webscenen.key;

    location /ws {
        proxy_pass http://127.0.0.1:9374;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

