name: Sync upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'ITC-MSM'
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward fork from its upstream repository
        env:
          # The fork sync may update workflow files, which GITHUB_TOKEN cannot do.
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
      - name: Merge synchronized main into platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merges"
          -f base=platform -f head=main
          -f commit_message="Merge synchronized upstream main into platform"
      - name: Rebuild platform images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run platform-images.yml --repo "$GITHUB_REPOSITORY" --ref platform
